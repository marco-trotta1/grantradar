name: Check GrantRadar
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: grantradar-cloud-verification
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_SECOND_EMAIL: ${{ secrets.E2E_SECOND_EMAIL }}
      E2E_SECOND_PASSWORD: ${{ secrets.E2E_SECOND_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check browser workflows
        run: |
          npm start > /tmp/grantradar-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          npm run test:e2e
